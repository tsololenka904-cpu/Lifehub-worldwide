<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeHub Worldwide - Sovereign Mobility & Longevity</title>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Global on-demand concierge from Maseru, Lesotho. 24/7 concierge +266 6284 0523" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Fonts / Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA Install -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('LifeHub PWA ready!', reg))
            .catch(err => console.log('SW failed', err));
        });
      }
    </script>
  </body>
  </html>
